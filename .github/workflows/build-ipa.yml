name: Build Unsigned IPA for Sideloading

on:
  workflow_dispatch: # Cho phép bấm nút Build thủ công trên GitHub

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Install CocoaPods dependencies & Prebuild
        run: |
          npx expo prebuild --platform ios

      - name: Build Xcode Project
        run: |
          cd ios
          xcodebuild clean build \
            -workspace *.xcworkspace \
            -scheme splitscreen \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath ../build/splitscreen.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive

      - name: Package to .ipa
        run: |
          mkdir -p Payload
          cp -r build/splitscreen.xcarchive/Products/Applications/*.app Payload/
          zip -r splitscreen.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: splitscreen-ipa
          path: splitscreen.ipa